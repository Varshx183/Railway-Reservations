services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - railway-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/railway
      DB_USER: railway
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  railway-data:
